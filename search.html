<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search User | Base44 Private Network</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0;
        }
        .search-card {
            background: white; padding: 3rem; border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 450px;
        }
        h1 { color: #2d3748; margin-bottom: 10px; }
        p { color: #718096; margin-bottom: 30px; font-size: 0.9em; }
        input {
            width: 100%; padding: 15px; border: 2px solid #e2e8f0; border-radius: 12px;
            font-size: 16px; outline: none; transition: border-color 0.3s; box-sizing: border-box; margin-bottom: 15px;
        }
        input:focus { border-color: #3182ce; }
        button {
            background: #3182ce; color: white; border: none; padding: 15px; width: 100%;
            border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: transform 0.2s;
        }
        button:hover { background: #2b6cb0; transform: translateY(-2px); }
        .secure-badge { background: #e6fffa; color: #319795; padding: 5px 10px; border-radius: 10px; font-size: 0.8em; font-weight: bold; }
    </style>
</head>
<body>
    <div class="search-card">
        <h1>🔒 Private Data Portal</h1>
        <p><span class="secure-badge">Secure Private Chain</span><br><br>Access requires a valid Buyer API Key or Payment Token. Data access expires in 24 hours.</p>
        
        <input type="text" id="searchInput" placeholder="Data Owner Name (e.g. Tom Chan)">
        <input type="password" id="apiKeyInput" placeholder="Enter API Key (Hint: type 'base44')">
        <button onclick="handleSearch()">Unlock Data</button>
    </div>

    <script>
        function handleSearch() {
            const name = document.getElementById("searchInput").value.trim();
            const apiKey = document.getElementById("apiKeyInput").value.trim();
            
            if (!name) { alert("Please enter a name."); return; }
            if (apiKey !== "base44") { alert("❌ Unauthorized! Invalid API Key or Payment Token."); return; }
            
            // Pass both name and API key to dashboard
            window.location.href = `dashboard.html?name=${encodeURIComponent(name)}&key=${encodeURIComponent(apiKey)}`;
        }
    </script>
</body>
</html>
